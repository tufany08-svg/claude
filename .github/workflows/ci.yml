name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11","3.12","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: |
          ads-intel analyze \
            --campaigns examples/campaigns.csv \
            --search-terms examples/search_terms.csv \
            --rules rules/default.json \
            --target-cpa 120 \
            --min-cost 1000 \
            --out /tmp/ads-report.md
          test -s /tmp/ads-report.md
