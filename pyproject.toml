[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ads-intelligence-lab"
version = "0.1.0"
description = "Transparent, advertiser-first Google Ads analysis engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ads-intel = "ads_intelligence.cli:main"

[tool.setuptools.packages.find]
include = ["ads_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
